<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Precios Carnicería</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000000;
            width: 100%;
            height: 100%;
        }
        
        .rotate-container {
            transform: rotate(-90deg);
            transform-origin: center center;
            width: 100vh;
            height: 100vw;
            position: absolute;
            top: 50%;
            left: 50%;
            margin: -50vw 0 0 -50vh;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="rotate-container">
        <iframe 
            src="https://docs.google.com/presentation/d/e/2PACX-1vSzR-ng7gJpwL5oWrml7Hg-FkENmYXIsTaMhm3pIHZHtQYUHloSo7b-GLs2FfFCHiTyWMiNutFWLGt8/embed?start=true&loop=true&delayms=30000"
            frameborder="0"
            allowfullscreen="true">
        </iframe>
    </div>
</body>
</html>
